<!-- interface extra para facilitar consultas/criação de alunos -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Alunos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- painel de cadastro -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-2xl font-bold mb-4 text-blue-600">Cadastrar Aluno</h2>
      <form id="form-cadastro" class="space-y-4">
        
        <div>
          <label class="block text-sm font-medium">Nome Completo</label>
          <input type="text" id="nome" class="w-full border p-2 rounded" required>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium">Data de Nascimento</label>
            <input type="date" id="nascimento" class="w-full border p-2 rounded" required>
          </div>
          <div>
            <label class="block text-sm font-medium">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" class="w-full border p-2 rounded">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium">E-mail</label>
            <input type="email" id="email" class="w-full border p-2 rounded" required>
          </div>
          <div>
            <label class="block text-sm font-medium">Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" class="w-full border p-2 rounded">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium">Estado</label>
            <input type="text" id="estado" placeholder="Ex: SP, PB" class="w-full border p-2 rounded">
          </div>
          <div>
            <label class="block text-sm font-medium">País</label>
            <input type="text" id="pais" value="Brasil" class="w-full border p-2 rounded bg-gray-50">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium">Curso</label>
          <input type="text" id="curso" class="w-full border p-2 rounded" required>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Salvar Aluno</button>
      </form>
    </div>

    <!-- painel de consultas -->
    <div class="bg-white p-6 rounded-lg shadow-md h-fit">
      <h2 class="text-2xl font-bold mb-4 text-green-600">Consultar Aluno</h2>
      <div class="flex gap-2 mb-4">
        <input type="number" id="busca-id" placeholder="ID do Aluno" min="1" class="w-full border p-2 rounded">
        <button onclick="buscarAluno()" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">Buscar</button>
      </div>
      
      <!-- resultado da busca expandido -->
      <div id="resultado" class="hidden border-t pt-4 space-y-2">
        <p><strong>Matrícula:</strong> <span id="res-matricula" class="text-blue-600 font-mono text-lg"></span></p>
        <p><strong>Nome:</strong> <span id="res-nome"></span></p>
        <p><strong>Idade:</strong> <span id="res-idade"></span> anos</p>
        <p><strong>CPF:</strong> <span id="res-cpf"></span></p>
        <p><strong>Contato:</strong> <span id="res-email"></span> | <span id="res-telefone"></span></p>
        <p><strong>Local:</strong> <span id="res-estado"></span> - <span id="res-pais"></span></p>
        <p><strong>Curso:</strong> <span id="res-curso"></span></p>
      </div>
    </div>
  </div>

  <script>
    // função para calcular a idade baseada na data de nascimento
    function calcularIdade(dataNascimento) {
      const nascimento = new Date(dataNascimento);
      const hoje = new Date();
      let idade = hoje.getFullYear() - nascimento.getFullYear();
      const mes = hoje.getMonth() - nascimento.getMonth();
      
      // se o mês atual for menor que o do aniversáio, ou se caso esteja no mesmo mês mas o dia ainda não passou, diminui 1 ano
      if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
        idade--;
      }
      return idade;
    }

    document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const dataNascimentoInput = document.getElementById('nascimento').value;
      const idadeCalculada = calcularIdade(dataNascimentoInput);

      //monta o aluno
      const payload = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        curso: document.getElementById('curso').value,
        cpf: document.getElementById('cpf').value || undefined,
        idade: idadeCalculada,
        telefone: document.getElementById('telefone').value || undefined,
        estado: document.getElementById('estado').value || undefined,
        pais: document.getElementById('pais').value || undefined,
      };

      const res = await fetch('/alunos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Aluno cadastrado com sucesso!');
        e.target.reset(); 
      } else {
        const erro = await res.json();
        alert('Erro: ' + (erro.message || JSON.stringify(erro.detalhes)));
      }
    });

    async function buscarAluno() {
      const id = document.getElementById('busca-id').value;
      if (!id) return alert('Digite um ID');

      if (!id || Number(id) < 1) {
        return alert('Por favor, digite um ID válido.');
    }

      const res = await fetch(`/alunos/${id}`);
      const dados = await res.json();

      if (res.ok) {
        document.getElementById('resultado').classList.remove('hidden');
        document.getElementById('res-matricula').textContent = dados.matricula || 'N/A';
        document.getElementById('res-nome').textContent = dados.nome;
        document.getElementById('res-idade').textContent = dados.idade || '--';
        document.getElementById('res-cpf').textContent = dados.cpf || 'Não informado';
        document.getElementById('res-email').textContent = dados.email;
        document.getElementById('res-telefone').textContent = dados.telefone || 'Não informado';
        document.getElementById('res-estado').textContent = dados.estado || '--';
        document.getElementById('res-pais').textContent = dados.pais;
        document.getElementById('res-curso').textContent = dados.curso || 'Não informado';
      } else {
        document.getElementById('resultado').classList.add('hidden');
        alert(dados.message);
      }
    }

    //formtador cpf
    document.getElementById('cpf').addEventListener('input', function(e) {
      let value = e.target.value;
      
      //remove carac. não númericos
      value = value.replace(/\D/g, "");
      
      //adiciona os pontos e o traço progressivamente
      if (value.length > 9) {
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
      } else if (value.length > 6) {
        value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
      } else if (value.length > 3) {
        value = value.replace(/(\d{3})(\d{1,3})/, "$1.$2");
      }
      
      e.target.value = value;
    });

    //formatador telefone
    document.getElementById('telefone').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, ""); //remove carac. não númericos

      if (value.length > 11) value = value.slice(0, 11); //limitador para 11 números

      if (value.length > 10) {
        // celular: (XX) XXXXX-XXXX
        value = value.replace(/^(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
      } else if (value.length > 6) {
        // fixo: (XX) XXXX-XXXX
        value = value.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
      } else if (value.length > 2) {
        // apenas DDD e início do número: (XX) X...
        value = value.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
      } else if (value.length > 0) {
        // apenas DDD: (X...
        value = value.replace(/^(\d*)/, "($1");
      }

      e.target.value = value;
    });

  </script>
</body>
</html>
